[package]
name = "pointdexter"
version = "0.1.0"
edition = "2024"

[dependencies]
spacerocks = { git = "https://github.com/kjnapier/spacerocks" }
polars = { version = "0.50.0", features = ["lazy"] }
# nalgebra = { version = "0.32.2" }
nalgebra = { version = "0.32.2", features = ["serde-serialize"] }

# kiddo = { git = "https://github.com/sdd/kiddo" }
kiddo = { version = "5.2.4" }

clap = { version = "*", features = ["derive"] }
serde_yaml = "*"
serde = { version = "*", features = ["derive"] }
image = "0.25"
itertools = "*"

csv = "*"

rayon = "*"

# anyhow = "*"
cdshealpix = { git = "https://github.com/cds-astro/cds-healpix-rust.git" }
plotly = { version = "*" , features = ["kaleido"] }  
# argmin = { version = "*"}
# argmin-math = { version = "*" }
# argmin-observer-slog = { version = "*" }
# ndarray = "0.15"
# ndarray-linalg = "0.16"
ordered-float = "4"
indicatif = { version = "0.17", features = ["rayon"] }

hashbrown = "0.14"
ahash = "0.8"
rand = "0.10.0"
once_cell = "1.21.4"
statrs = "0.18.0"
argmin = "0.11.0"
bloomfilter = "3.0.1"
rust-spice = { version = "0.7.4", default-features = false, features = ["noclang"] }
serde_json = "1.0.149"
flate2 = "1.1.9"


[patch."https://github.com/kjnapier/spacerocks"]
spacerocks = { path = "/data/trruch/SpaceRocksV3/spacerocks" }


[profile.release]
# lto = "fat"          # link time optimization
# codegen-units = 1    # more stable profiles (optional)
# panic = "abort"      # optional
# strip = true         # Strip symbols from the binary (reduces size) [4]
# debug = false        # Ensure debug info is off
# [profile.release.package."*"]
# debug = true
